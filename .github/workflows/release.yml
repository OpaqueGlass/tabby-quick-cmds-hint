name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v3

      # Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: setup yarn
        run: npm i -g yarn

      # Install dependencies
      - name: Install dependencies
        run: yarn install

      # Build for production
      - name: Build for production
        run: yarn build

      - name: Zip it
        run: zip -r dist.zip dist/

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Get CHANGELOGS
        run: python ./scripts/release_note.py
      
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: ./result.txt
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist.zip

      - uses: JS-DevTools/npm-publish@v3
        if: ${{ ! (contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev')) }}
        with:
          token: ${{ secrets.NPM_TOKEN }}
          dry-run: true
          provenance: true
