name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v3

      # Install Node.js
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm
        run: npm install -g npm@11

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: yarn --version

      - name: Get Yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build for production
        run: |
          yarn build
        env:
          TSC_COMPILE_ON_ERROR: true
          ESLINT_NO_DEV_ERRORS: true

      # Package as zip file
      - name: Zip it
        run: zip -r dist.zip dist/

      # Get changelog
      - name: Get CHANGELOGS
        run: node ./scripts/release_note.js
      
      - name: publish on npm
        if: ${{ ! (contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev')) }}
        run: npm stage publish --provenance

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: ./result.txt
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'dev') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist.zip