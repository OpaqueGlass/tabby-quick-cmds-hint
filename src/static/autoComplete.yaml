  - command: "nvidia-smi"
    arguments:
      # 基础查看命令
      - name: "-L, --list-gpus"
        content: "-L"
        despLangKey: "arguments_complete.nvidia_smi.list_gpus"
      
      # 查询相关命令
      - name: "-q, --query"
        content: "-q"
        despLangKey: "arguments_complete.nvidia_smi.query"
      - name: "-i <gpu_id> -q"
        content: "-i"
        despLangKey: "arguments_complete.nvidia_smi.query_specific"
      - name: "-q -x"
        content: "-q -x"
        despLangKey: "arguments_complete.nvidia_smi.query_xml"
      - name: "-q -d MEMORY"
        content: "-q -d MEMORY"
        despLangKey: "arguments_complete.nvidia_smi.query_memory"
      - name: "-q -d UTILIZATION"
        content: "-q -d UTILIZATION"
        despLangKey: "arguments_complete.nvidia_smi.query_utilization"
      - name: "-q -d ECC"
        content: "-q -d ECC"
        despLangKey: "arguments_complete.nvidia_smi.query_ecc"
      - name: "-q -d TEMPERATURE"
        content: "-q -d TEMPERATURE"
        despLangKey: "arguments_complete.nvidia_smi.query_temperature"
      - name: "-q -d POWER"
        content: "-q -d POWER"
        despLangKey: "arguments_complete.nvidia_smi.query_power"
      - name: "-q -d CLOCK"
        content: "-q -d CLOCK"
        despLangKey: "arguments_complete.nvidia_smi.query_clock"
      
      # 循环监控命令
      - name: "-l <seconds>"
        content: "-l"
        despLangKey: "arguments_complete.nvidia_smi.loop"
      - name: "-l 1"
        content: "-l 1"
        despLangKey: "arguments_complete.nvidia_smi.loop_1s"
      - name: "-l 5"
        content: "-l 5"
        despLangKey: "arguments_complete.nvidia_smi.loop_5s"
      - name: "-lms <milliseconds>"
        content: "-lms"
        despLangKey: "arguments_complete.nvidia_smi.loop_ms"
      
      # 特定查询命令
      - name: "--query-gpu=name,memory.total,memory.used"
        content: "--query-gpu=name,memory.total,memory.used"
        despLangKey: "arguments_complete.nvidia_smi.query_gpu_basic"
      - name: "--query-gpu=utilization.gpu,utilization.memory --format=csv"
        content: "--query-gpu=utilization.gpu,utilization.memory --format=csv"
        despLangKey: "arguments_complete.nvidia_smi.query_utilization_csv"
      - name: "--query-gpu=temperature.gpu,power.draw --format=csv,noheader,nounits"
        content: "--query-gpu=temperature.gpu,power.draw --format=csv,noheader,nounits"
        despLangKey: "arguments_complete.nvidia_smi.query_temp_power"
      - name: "--query-compute-apps --format=csv"
        content: "--query-compute-apps --format=csv"
        despLangKey: "arguments_complete.nvidia_smi.query_compute_apps"
      
      # 拓扑和连接信息
      - name: "topo -m"
        content: "topo -m"
        despLangKey: "arguments_complete.nvidia_smi.topo_matrix"
      - name: "topo -p2p r"
        content: "topo -p2p r"
        despLangKey: "arguments_complete.nvidia_smi.topo_p2p"
      - name: "nvlink -s"
        content: "nvlink -s"
        despLangKey: "arguments_complete.nvidia_smi.nvlink_status"
      
      # 设备修改命令（需要root权限）
      - name: "-pm 1"
        content: "-pm 1"
        despLangKey: "arguments_complete.nvidia_smi.persistence_enable"
      - name: "-pm 0"
        content: "-pm 0"
        despLangKey: "arguments_complete.nvidia_smi.persistence_disable"
      - name: "-c 0"
        content: "-c 0"
        despLangKey: "arguments_complete.nvidia_smi.compute_default"
      - name: "-c 1"
        content: "-c 1"
        despLangKey: "arguments_complete.nvidia_smi.compute_exclusive_thread"
      - name: "-c 2"
        content: "-c 2"
        despLangKey: "arguments_complete.nvidia_smi.compute_prohibited"
      
      # 时钟控制命令
      - name: "-lgc <min>,<max>"
        content: "-lgc"
        despLangKey: "arguments_complete.nvidia_smi.lock_gpu_clocks"
      - name: "-lmc <min>,<max>"
        content: "-lmc"
        despLangKey: "arguments_complete.nvidia_smi.lock_memory_clocks"
      - name: "-rgc"
        content: "-rgc"
        despLangKey: "arguments_complete.nvidia_smi.reset_gpu_clocks"
      - name: "-rmc"
        content: "-rmc"
        despLangKey: "arguments_complete.nvidia_smi.reset_memory_clocks"
      
      # 功耗管理
      - name: "-pl <watts>"
        content: "-pl"
        despLangKey: "arguments_complete.nvidia_smi.power_limit"
      
      # GPU重置
      - name: "-r"
        content: "-r"
        despLangKey: "arguments_complete.nvidia_smi.gpu_reset"
      - name: "-r bus"
        content: "-r bus"
        despLangKey: "arguments_complete.nvidia_smi.gpu_reset_bus"
      
      # MIG相关
      - name: "-mig 1"
        content: "-mig 1"
        despLangKey: "arguments_complete.nvidia_smi.mig_enable"
      - name: "-mig 0"
        content: "-mig 0"
        despLangKey: "arguments_complete.nvidia_smi.mig_disable"
      - name: "mig -lgpu"
        content: "mig -lgpu"
        despLangKey: "arguments_complete.nvidia_smi.mig_list_gpu"
      
      # 输出格式化
      - name: "-f <filename>"
        content: "-f"
        despLangKey: "arguments_complete.nvidia_smi.output_file"
      - name: "-x"
        content: "-x"
        despLangKey: "arguments_complete.nvidia_smi.xml_format"
      - name: "--dtd"
        content: "--dtd"
        despLangKey: "arguments_complete.nvidia_smi.dtd"
