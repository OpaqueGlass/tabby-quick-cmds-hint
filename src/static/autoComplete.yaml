#Command Parameter Autocomplete Configuration File #Format Description: 
# - command: command name
#   arguments: A list of parameters, each containing the following fields: 
#     - name: Display name (placeholder supported, such as<files>, will be displayed in UI) 
#     - content: actual input content (content actually input to terminal after user selection
#     - despLangKey: Optional, the translation key for the description, in the format of the path in i18n.yaml, such as "arguments_complete.git.add" 
#     If despLangKey is not provided, name will be used as the description 

# 命令参数自动补全配置文件
# 格式说明：
# - command: 命令名称
#   arguments: 参数列表，每个参数包含以下字段：
#     - name: 显示名称（支持占位符如 <files>，会在UI中显示）
#     - content: 实际输入内容（用户选择后实际输入到终端的内容）
#     - despLangKey: 可选，描述的翻译键，格式为 i18n.yaml 中的路径，如 "arguments_complete.git.add"
#     如果不提供 despLangKey，将使用 name 作为描述
commands:
  # Git 命令
  - command: "git"
    arguments:
      - name: "add <files>"
        content: "add"
        despLangKey: "arguments_complete.git.add"
      - name: "add ."
        content: "add ."
        despLangKey: "arguments_complete.git.add_all"
      - name: "add -A"
        content: "add -A"
        despLangKey: "arguments_complete.git.add_all_changes"
      - name: "commit -m \"<message>\""
        content: "commit -m \"\""
        despLangKey: "arguments_complete.git.commit"
      - name: "commit --amend"
        content: "commit --amend"
        despLangKey: "arguments_complete.git.commit_amend"
      - name: "commit -a -m \"<message>\""
        content: "commit -a -m \"\""
        despLangKey: "arguments_complete.git.commit_all"
      - name: "push origin <branch>"
        content: "push origin"
        despLangKey: "arguments_complete.git.push"
      - name: "push -u origin <branch>"
        content: "push -u origin"
        despLangKey: "arguments_complete.git.push_upstream"
      - name: "push --force"
        content: "push --force"
        despLangKey: "arguments_complete.git.push_force"
      - name: "pull origin <branch>"
        content: "pull origin"
        despLangKey: "arguments_complete.git.pull"
      - name: "pull --rebase"
        content: "pull --rebase"
        despLangKey: "arguments_complete.git.pull_rebase"
      - name: "branch -a"
        content: "branch -a"
        despLangKey: "arguments_complete.git.branch_list"
      - name: "branch <name>"
        content: "branch"
        despLangKey: "arguments_complete.git.branch_create"
      - name: "branch -d <name>"
        content: "branch -d"
        despLangKey: "arguments_complete.git.branch_delete"
      - name: "checkout <branch>"
        content: "checkout"
        despLangKey: "arguments_complete.git.checkout"
      - name: "checkout -b <new-branch>"
        content: "checkout -b"
        despLangKey: "arguments_complete.git.checkout_create"
      - name: "merge <branch>"
        content: "merge"
        despLangKey: "arguments_complete.git.merge"
      - name: "status"
        content: "status"
        despLangKey: "arguments_complete.git.status"
      - name: "status -s"
        content: "status -s"
        despLangKey: "arguments_complete.git.status_short"
      - name: "log --oneline"
        content: "log --oneline"
        despLangKey: "arguments_complete.git.log_oneline"
      - name: "log --graph"
        content: "log --graph"
        despLangKey: "arguments_complete.git.log_graph"
      - name: "log -n <number>"
        content: "log -n"
        despLangKey: "arguments_complete.git.log_limit"

  # Docker 命令
  - command: "docker"
    arguments:
      # 基础系统命令
      - name: "info"
        content: "info"
        despLangKey: "arguments_complete.docker.info"
      - name: "login <server>"
        content: "login"
        despLangKey: "arguments_complete.docker.login"
      - name: "login"
        content: "login"
        despLangKey: "arguments_complete.docker.login_default"
      
      # 镜像管理命令
      - name: "images"
        content: "images"
        despLangKey: "arguments_complete.docker.images"
      - name: "images -a"
        content: "images -a"
        despLangKey: "arguments_complete.docker.images_all"
      - name: "pull <image>"
        content: "pull"
        despLangKey: "arguments_complete.docker.pull"
      - name: "push <image>"
        content: "push"
        despLangKey: "arguments_complete.docker.push"
      - name: "build -t <tag> ."
        content: "build -t"
        despLangKey: "arguments_complete.docker.build"
      - name: "build --no-cache -t <tag> ."
        content: "build --no-cache -t"
        despLangKey: "arguments_complete.docker.build_no_cache"
      - name: "rmi <image>"
        content: "rmi"
        despLangKey: "arguments_complete.docker.rmi"
      - name: "rmi -f <image>"
        content: "rmi -f"
        despLangKey: "arguments_complete.docker.rmi_force"
      - name: "history <image>"
        content: "history"
        despLangKey: "arguments_complete.docker.history"
      - name: "tag <source> <target>"
        content: "tag"
        despLangKey: "arguments_complete.docker.tag"
      
      # 容器运行命令
      - name: "run -it <image>"
        content: "run -it"
        despLangKey: "arguments_complete.docker.run_interactive"
      - name: "run -d <image>"
        content: "run -d"
        despLangKey: "arguments_complete.docker.run_detached"
      - name: "run -p <host-port>:<container-port> <image>"
        content: "run -p"
        despLangKey: "arguments_complete.docker.run_port"
      - name: "run --rm <image>"
        content: "run --rm"
        despLangKey: "arguments_complete.docker.run_remove"
      - name: "run -e <VAR>=<value> <image>"
        content: "run -e"
        despLangKey: "arguments_complete.docker.run_env"
      - name: "run -v <host-dir>:<container-dir> <image>"
        content: "run -v"
        despLangKey: "arguments_complete.docker.run_volume"
      - name: "run --name <name> <image>"
        content: "run --name"
        despLangKey: "arguments_complete.docker.run_name"
      
      # 容器管理命令
      - name: "ps"
        content: "ps"
        despLangKey: "arguments_complete.docker.ps"
      - name: "ps -a"
        content: "ps -a"
        despLangKey: "arguments_complete.docker.ps_all"
      - name: "start <container>"
        content: "start"
        despLangKey: "arguments_complete.docker.start"
      - name: "stop <container>"
        content: "stop"
        despLangKey: "arguments_complete.docker.stop"
      - name: "restart <container>"
        content: "restart"
        despLangKey: "arguments_complete.docker.restart"
      - name: "rm <container>"
        content: "rm"
        despLangKey: "arguments_complete.docker.rm"
      - name: "rm -f <container>"
        content: "rm -f"
        despLangKey: "arguments_complete.docker.rm_force"
      - name: "exec -it <container> /bin/bash"
        content: "exec -it <container> /bin/bash"
        despLangKey: "arguments_complete.docker.exec_bash"
      - name: "exec -it <container> sh"
        content: "exec -it"
        despLangKey: "arguments_complete.docker.exec_sh"
      - name: "logs <container>"
        content: "logs"
        despLangKey: "arguments_complete.docker.logs"
      - name: "logs -f <container>"
        content: "logs -f"
        despLangKey: "arguments_complete.docker.logs_follow"
      - name: "inspect <container>"
        content: "inspect"
        despLangKey: "arguments_complete.docker.inspect"
      
      # 数据卷命令
      - name: "volume create <name>"
        content: "volume create"
        despLangKey: "arguments_complete.docker.volume_create"
      - name: "volume ls"
        content: "volume ls"
        despLangKey: "arguments_complete.docker.volume_list"
      - name: "volume inspect <name>"
        content: "volume inspect"
        despLangKey: "arguments_complete.docker.volume_inspect"
      - name: "volume rm <name>"
        content: "volume rm"
        despLangKey: "arguments_complete.docker.volume_remove"
      - name: "volume prune"
        content: "volume prune"
        despLangKey: "arguments_complete.docker.volume_prune"
      
      # 网络命令
      - name: "network ls"
        content: "network ls"
        despLangKey: "arguments_complete.docker.network_list"
      - name: "network create <name>"
        content: "network create"
        despLangKey: "arguments_complete.docker.network_create"
      - name: "network rm <network>"
        content: "network rm"
        despLangKey: "arguments_complete.docker.network_remove"
      - name: "network inspect <network>"
        content: "network inspect"
        despLangKey: "arguments_complete.docker.network_inspect"
      - name: "network connect <network> <container>"
        content: "network connect"
        despLangKey: "arguments_complete.docker.network_connect"
      - name: "run --network=<network> <image>"
        content: "run --network="
        despLangKey: "arguments_complete.docker.run_network"
      
      # 系统管理命令
      - name: "system df"
        content: "system df"
        despLangKey: "arguments_complete.docker.system_df"
      - name: "system prune"
        content: "system prune"
        despLangKey: "arguments_complete.docker.system_prune"
      - name: "system prune -a"
        content: "system prune -a"
        despLangKey: "arguments_complete.docker.system_prune_all"
      - name: "system info"
        content: "system info"
        despLangKey: "arguments_complete.docker.system_info"
      
      # Docker Compose 相关（如果需要）
      - name: "compose up"
        content: "compose up"
        despLangKey: "arguments_complete.docker.compose_up"
      - name: "compose up -d"
        content: "compose up -d"
        despLangKey: "arguments_complete.docker.compose_up_detached"
      - name: "compose down"
        content: "compose down"
        despLangKey: "arguments_complete.docker.compose_down"
      - name: "compose ps"
        content: "compose ps"
        despLangKey: "arguments_complete.docker.compose_ps"

  # NPM 命令 - 展示没有翻译键的情况
  - command: "npm"
    arguments:
      - name: "install"
        content: "install"
      - name: "install <package>"
        content: "install"
      - name: "install --save-dev <package>"
        content: "install --save-dev"
      - name: "install -g <package>"
        content: "install -g"
      - name: "run <script>"
        content: "run"
      - name: "run build"
        content: "run build"
      - name: "run test"
        content: "run test"
      - name: "run start"
        content: "run start"
      - name: "run dev"
        content: "run dev"
      - name: "update"
        content: "update"
      - name: "uninstall <package>"
        content: "uninstall"

  # Linux 基础命令
  - command: "ls"
    arguments:
      - name: "-l"
        content: "-l"
      - name: "-la"
        content: "-la"
      - name: "-lh"
        content: "-lh"
      - name: "-lt"
        content: "-lt"

  - command: "cd"
    arguments:
      - name: ".."
        content: ".."
      - name: "~"
        content: "~"
      - name: "-"
        content: "-"

  - command: "grep"
    arguments:
      - name: "-r <pattern> ."
        content: "-r"
      - name: "-i <pattern>"
        content: "-i"
      - name: "-n <pattern>"
        content: "-n"
      - name: "-v <pattern>"
        content: "-v"

  - command: "find"
    arguments:
      - name: ". -name \"<pattern>\""
        content: ". -name \"\""
      - name: ". -type f"
        content: ". -type f"
      - name: ". -type d"
        content: ". -type d"
      - name: ". -size +<size>"
        content: ". -size +"

  - command: "curl"
    arguments:
      - name: "-X GET <url>"
        content: "-X GET"
      - name: "-X POST <url>"
        content: "-X POST"
      - name: "-H \"<header>\" <url>"
        content: "-H \"\""
      - name: "-d \"<data>\" <url>"
        content: "-d \"\""
      - name: "-o <file> <url>"
        content: "-o"

  - command: "tar"
    arguments:
      # 基础操作
      - name: "-xvf <archive.tar>"
        content: "-xvf"
        despLangKey: "arguments_complete.tar.extract"
      - name: "-cvf <archive.tar> <files>"
        content: "-cvf"
        despLangKey: "arguments_complete.tar.create"
      - name: "-tvf <archive.tar>"
        content: "-tvf"
        despLangKey: "arguments_complete.tar.list"
      # gzip 压缩
      - name: "-czvf <archive.tar.gz> <files>"
        content: "-czvf"
        despLangKey: "arguments_complete.tar.create_gzip"
      - name: "-xzvf <archive.tar.gz>"
        content: "-xzvf"
        despLangKey: "arguments_complete.tar.extract_gzip"
      - name: "-tzvf <archive.tar.gz>"
        content: "-tzvf"
        despLangKey: "arguments_complete.tar.list_gzip"
      # bzip2 压缩
      - name: "-cjvf <archive.tar.bz2> <files>"
        content: "-cjvf"
        despLangKey: "arguments_complete.tar.create_bzip2"
      - name: "-xjvf <archive.tar.bz2>"
        content: "-xjvf"
        despLangKey: "arguments_complete.tar.extract_bzip2"
      - name: "-tjvf <archive.tar.bz2>"
        content: "-tjvf"
        despLangKey: "arguments_complete.tar.list_bzip2"
      # xz 压缩
      - name: "-cJvf <archive.tar.xz> <files>"
        content: "-cJvf"
        despLangKey: "arguments_complete.tar.create_xz"
      - name: "-xJvf <archive.tar.xz>"
        content: "-xJvf"
        despLangKey: "arguments_complete.tar.extract_xz"
      - name: "-tJvf <archive.tar.xz>"
        content: "-tJvf"
        despLangKey: "arguments_complete.tar.list_xz"
      # 排除文件
      - name: "--exclude=<pattern> -cvf <archive.tar> <files>"
        content: "--exclude="
        despLangKey: "arguments_complete.tar.exclude"
      - name: "--exclude-from=<file> -cvf <archive.tar> <files>"
        content: "--exclude-from="
        despLangKey: "arguments_complete.tar.exclude_from"
      # 解压到指定目录
      - name: "-xvf <archive.tar> -C <directory>"
        content: "-xvf"
        despLangKey: "arguments_complete.tar.extract_to"
      # 增量备份
      - name: "--listed-incremental=<snapshot> -cvf <archive.tar> <files>"
        content: "--listed-incremental="
        despLangKey: "arguments_complete.tar.incremental"

  - command: "rsync"
    arguments:
      # 基础同步
      - name: "-r <source> <destination>"
        content: "-r"
        despLangKey: "arguments_complete.rsync.recursive"
      - name: "-a <source> <destination>"
        content: "-a"
        despLangKey: "arguments_complete.rsync.archive"
      - name: "-av <source> <destination>"
        content: "-av"
        despLangKey: "arguments_complete.rsync.archive_verbose"
      # 测试和预览
      - name: "-anv <source> <destination>"
        content: "-anv"
        despLangKey: "arguments_complete.rsync.dry_run"
      - name: "-av --dry-run <source> <destination>"
        content: "-av --dry-run"
        despLangKey: "arguments_complete.rsync.dry_run_verbose"
      # 镜像同步
      - name: "-av --delete <source> <destination>"
        content: "-av --delete"
        despLangKey: "arguments_complete.rsync.mirror"
      # 排除文件
      - name: "-av --exclude='<pattern>' <source> <destination>"
        content: "-av --exclude=''"
        despLangKey: "arguments_complete.rsync.exclude"
      - name: "-av --exclude-from=<file> <source> <destination>"
        content: "-av --exclude-from="
        despLangKey: "arguments_complete.rsync.exclude_from"
      - name: "-av --include='<pattern>' --exclude='*' <source> <destination>"
        content: "-av --include='' --exclude='*'"
        despLangKey: "arguments_complete.rsync.include_only"
      # 远程同步 SSH
      - name: "-av <source> <user@host:destination>"
        content: "-av"
        despLangKey: "arguments_complete.rsync.remote_upload"
      - name: "-av <user@host:source> <destination>"
        content: "-av"
        despLangKey: "arguments_complete.rsync.remote_download"
      - name: "-av -e 'ssh -p <port>' <source> <user@host:destination>"
        content: "-av -e 'ssh -p '"
        despLangKey: "arguments_complete.rsync.ssh_port"
      # rsync 协议
      - name: "-av <source> <host::module/destination>"
        content: "-av"
        despLangKey: "arguments_complete.rsync.daemon"
      - name: "-av <source> rsync://<host>/module/destination"
        content: "-av"
        despLangKey: "arguments_complete.rsync.daemon_url"
      # 增量备份
      - name: "-a --delete --link-dest=<base> <source> <destination>"
        content: "-a --delete --link-dest="
        despLangKey: "arguments_complete.rsync.incremental"
      # 进度和恢复
      - name: "-avP <source> <destination>"
        content: "-avP"
        despLangKey: "arguments_complete.rsync.progress"
      - name: "-av --partial --append <source> <destination>"
        content: "-av --partial --append"
        despLangKey: "arguments_complete.rsync.resume"
      # 校验和压缩
      - name: "-avc <source> <destination>"
        content: "-avc"
        despLangKey: "arguments_complete.rsync.checksum"
      - name: "-avz <source> <destination>"
        content: "-avz"
        despLangKey: "arguments_complete.rsync.compress"
      # 带宽限制
      - name: "-av --bwlimit=<KB/s> <source> <destination>"
        content: "-av --bwlimit="
        despLangKey: "arguments_complete.rsync.bandwidth"
      # 文件大小限制
      - name: "-av --max-size=<size> <source> <destination>"
        content: "-av --max-size="
        despLangKey: "arguments_complete.rsync.max_size"
      - name: "-av --min-size=<size> <source> <destination>"
        content: "-av --min-size="
        despLangKey: "arguments_complete.rsync.min_size"
      # 更新策略
      - name: "-avu <source> <destination>"
        content: "-avu"
        despLangKey: "arguments_complete.rsync.update"
      - name: "-av --ignore-existing <source> <destination>"
        content: "-av --ignore-existing"
        despLangKey: "arguments_complete.rsync.ignore_existing"
      - name: "-av --existing <source> <destination>"
        content: "-av --existing"
        despLangKey: "arguments_complete.rsync.existing_only"

  - command: "crontab"
    arguments:
      # 基础操作
      - name: "-l"
        content: "-l"
        despLangKey: "arguments_complete.crontab.list"
      - name: "-e"
        content: "-e"
        despLangKey: "arguments_complete.crontab.edit"
      - name: "-r"
        content: "-r"
        despLangKey: "arguments_complete.crontab.remove"
      - name: "-r -i"
        content: "-r -i"
        despLangKey: "arguments_complete.crontab.remove_interactive"
      # 指定用户操作
      - name: "-u <user> -l"
        content: "-u"
        despLangKey: "arguments_complete.crontab.list_user"
      - name: "-u <user> -e"
        content: "-u"
        despLangKey: "arguments_complete.crontab.edit_user"
      - name: "-u <user> -r"
        content: "-u"
        despLangKey: "arguments_complete.crontab.remove_user"
      - name: "-u <user> -r -i"
        content: "-u"
        despLangKey: "arguments_complete.crontab.remove_user_interactive"
      # 从文件安装
      - name: "<file>"
        content: ""
        despLangKey: "arguments_complete.crontab.install_file"
      - name: "-u <user> <file>"
        content: "-u"
        despLangKey: "arguments_complete.crontab.install_file_user"
      - name: "-"
        content: "-"
        despLangKey: "arguments_complete.crontab.install_stdin"

  - command: "journalctl"
    arguments:
      # 基础查看
      - name: ""
        content: ""
        despLangKey: "arguments_complete.journalctl.view_all"
      - name: "-f"
        content: "-f"
        despLangKey: "arguments_complete.journalctl.follow"
      - name: "--follow"
        content: "--follow"
        despLangKey: "arguments_complete.journalctl.follow_long"
      # 行数限制
      - name: "-n <lines>"
        content: "-n"
        despLangKey: "arguments_complete.journalctl.lines"
      - name: "--lines=<N>"
        content: "--lines="
        despLangKey: "arguments_complete.journalctl.lines_long"
      - name: "-n 50"
        content: "-n 50"
        despLangKey: "arguments_complete.journalctl.lines_50"
      - name: "-n 100"
        content: "-n 100"
        despLangKey: "arguments_complete.journalctl.lines_100"
      # 时间范围
      - name: "--since \"<time>\""
        content: "--since \"\""
        despLangKey: "arguments_complete.journalctl.since"
      - name: "--until \"<time>\""
        content: "--until \"\""
        despLangKey: "arguments_complete.journalctl.until"
      - name: "--since today"
        content: "--since today"
        despLangKey: "arguments_complete.journalctl.since_today"
      - name: "--since yesterday"
        content: "--since yesterday"
        despLangKey: "arguments_complete.journalctl.since_yesterday"
      - name: "--since \"1 hour ago\""
        content: "--since \"1 hour ago\""
        despLangKey: "arguments_complete.journalctl.since_hour"
      # 优先级过滤
      - name: "-p err"
        content: "-p err"
        despLangKey: "arguments_complete.journalctl.priority_error"
      - name: "-p warning"
        content: "-p warning"
        despLangKey: "arguments_complete.journalctl.priority_warning"
      - name: "-p info"
        content: "-p info"
        despLangKey: "arguments_complete.journalctl.priority_info"
      - name: "--priority=<level>"
        content: "--priority="
        despLangKey: "arguments_complete.journalctl.priority"
      # 服务单元
      - name: "-u <service>"
        content: "-u"
        despLangKey: "arguments_complete.journalctl.unit"
      - name: "--unit=<service>"
        content: "--unit="
        despLangKey: "arguments_complete.journalctl.unit_long"
      - name: "-u nginx"
        content: "-u nginx"
        despLangKey: "arguments_complete.journalctl.unit_nginx"
      - name: "-u ssh"
        content: "-u ssh"
        despLangKey: "arguments_complete.journalctl.unit_ssh"
      - name: "-u docker"
        content: "-u docker"
        despLangKey: "arguments_complete.journalctl.unit_docker"
      # 内核日志
      - name: "-k"
        content: "-k"
        despLangKey: "arguments_complete.journalctl.kernel"
      - name: "--dmesg"
        content: "--dmesg"
        despLangKey: "arguments_complete.journalctl.dmesg"
      # 启动日志
      - name: "-b"
        content: "-b"
        despLangKey: "arguments_complete.journalctl.boot"
      - name: "--boot"
        content: "--boot"
        despLangKey: "arguments_complete.journalctl.boot_long"
      - name: "-b -1"
        content: "-b -1"
        despLangKey: "arguments_complete.journalctl.boot_previous"
      - name: "--list-boots"
        content: "--list-boots"
        despLangKey: "arguments_complete.journalctl.list_boots"
      # 用户和进程
      - name: "_UID=<uid>"
        content: "_UID="
        despLangKey: "arguments_complete.journalctl.uid"
      - name: "_PID=<pid>"
        content: "_PID="
