  # 插件介绍和说明
  intro:
    plugin_requirement:
      en_US: "To use this plugin, first download and enable the plugin `tabby-quick-cmds`, and then create some commands within it."
      zh_CN: "为使用此插件，请先下载启用tabby-quick-cmds插件，并在其中创建一些命令。"
